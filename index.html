<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10m高度风速+台风阵风换算工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f0f4f8;
            padding: 40px 20px;
        }
        .container {
            max-width: 620px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0, 80, 160, 0.12);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 22px;
            margin-bottom: 28px;
        }
        .block-title{
            font-size:16px;
            font-weight:bold;
            color:#224;
            margin:20px 0 10px;
            border-left:4px solid #3182ce;
            padding-left:8px;
        }
        .form-item {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 15px;
            color: #2d3748;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input,select {
            width: 100%;
            height: 46px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 16px;
        }
        input:focus,select:focus {
            outline: none;
            border-color: #3182ce;
        }
        .calc-btn {
            width: 100%;
            height: 48px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        .calc-btn:hover {
            background-color: #2b6cb0;
        }
        .result-box {
            margin-top: 26px;
            padding: 20px;
            background-color: #ebf8ff;
            border-radius: 10px;
            border-left: 5px solid #3182ce;
            display:none;
        }
        .result-item {
            margin:10px 0;
            font-size:15px;
        }
        .tip {
            margin-top: 20px;
            font-size: 13px;
            color: #718096;
            line-height:1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>10m高度风速+台风阵风换算工具</h1>

        <div class="block-title">一、高度订正输入</div>
        <div class="form-item">
            <label>测风仪器离地高度 Z（m）</label>
            <input type="number" id="Z" step="0.01" placeholder="例如：20">
        </div>
        <div class="form-item">
            <label>Z高度实测平均风速 Uz（m/s）</label>
            <input type="number" id="Uz" step="0.1" placeholder="例如：6">
        </div>
        <div class="form-item">
            <label>观测风向（0~360°，正北0°顺时针）</label>
            <input type="number" id="windDir" step="1" placeholder="例如：180">
        </div>

        <div class="block-title">二、热带气旋阵风参数配置</div>
        <div class="form-item">
            <label>下垫面地形类别</label>
            <select id="terrain">
                <option value="inland">In-Land 内陆开阔地形</option>
                <option value="offland">Off-Land 海岸离岸风</option>
                <option value="offsea">Off-Sea 海岸向岸风</option>
                <option value="atsea">At-Sea 离岸20km以上远海</option>
            </select>
        </div>
        <div class="form-item">
            <label>基准平均风时长</label>
            <select id="To">
                <option value="3600">3600s（1小时平均）</option>
                <option value="600">600s（10分钟平均）</option>
                <option value="180">180s（3分钟平均）</option>
                <option value="120">120s（2分钟平均）</option>
                <option value="60">60s（1分钟平均）</option>
            </select>
        </div>
        <div class="form-item">
            <label>目标阵风持续时长</label>
            <select id="tau">
                <option value="60">60s</option>
                <option value="120">120s</option>
                <option value="180">180s</option>
                <option value="600">600s</option>
            </select>
        </div>

        <button class="calc-btn" onclick="calcAll()">全部计算</button>

        <div class="result-box" id="resultBox">
            <div class="result-item"><strong>10米基准平均风速：</strong><span id="u10"></span> m/s</div>
            <div class="result-item"><strong>观测风向：</strong><span id="dirOut"></span> °</div>
            <div class="result-item"><strong>10m高度风动压：</strong><span id="pressure"></span> hPa</div>
            <div class="result-item"><strong>查表阵风系数G：</strong><span id="gustFactor"></span></div>
            <div class="result-item"><strong>目标阵风风速：</strong><span id="gustWind"></span> m/s</div>
        </div>

        <div class="tip">
            技术说明：
            <br>1.高度订正采用中性层结对数风廓线，地表粗糙度z0=0.0015m，适用于开阔平原/近海中性大气；
            <br>2.阵风系数严格采用热带气旋专用换算表，仅适用于台风、飓风强风场；
            <br>3.阵风计算公式：阵风风速 = 10m基准平均风速 × 阵风系数；风动压=0.613×风速²/100；
            <br>4.若时距组合无原始表格系数，工具将直接终止计算并提示，不输出结果。
        </div>
    </div>

    <script>
        // 原始表格原始系数（仅保留原图存在的有效τ，多余时长不写入）
        const gustTable = {
            inland:{
                3600:{60:1.28,120:1.19,180:1.15,600:1.08},
                600:{60:1.21,120:1.12,180:1.09,600:1.00},
                180:{60:1.15,120:1.07,180:1.00},
                120:{60:1.13,120:1.00},
                60:{60:1.00}
            },
            offland:{
                3600:{60:1.22,120:1.15,180:1.12,600:1.06},
                600:{60:1.16,120:1.09,180:1.06,600:1.00},
                180:{60:1.10,120:1.04,180:1.00},
                120:{60:1.08,120:1.00},
                60:{60:1.00}
            },
            offsea:{
                3600:{60:1.17,120:1.11,180:1.09,600:1.05},
                600:{60:1.11,120:1.05,180:1.03,600:1.00},
                180:{60:1.05,120:1.00,180:1.00},
                120:{60:1.03,120:1.00},
                60:{60:1.00}
            },
            atsea:{
                3600:{60:1.11,120:1.07,180:1.06,600:1.03},
                600:{60:1.05,120:1.02,180:1.00,600:1.00},
                180:{60:1.00,120:1.00,180:1.00},
                120:{60:1.00,120:1.00},
                60:{60:1.00}
            }
        };
        const z0 = 0.0015;

        function calcAll(){
            // 隐藏结果面板
            document.getElementById('resultBox').style.display = "none";

            const Z = parseFloat(document.getElementById('Z').value);
            const Uz = parseFloat(document.getElementById('Uz').value);
            const windDir = document.getElementById('windDir').value;
            const terrain = document.getElementById('terrain').value;
            const To = parseInt(document.getElementById('To').value);
            const tau = parseInt(document.getElementById('tau').value);

            // 基础风速高度校验
            if(isNaN(Z)||isNaN(Uz)||Z<=0||Uz<=0){
                alert("请填写有效的观测高度与风速数值");
                return;
            }

            // 判断该地形-基准时长下是否存在此阵风时长系数
            const terrainData = gustTable[terrain];
            if (!terrainData || !terrainData[To] || terrainData[To][tau] === undefined) {
                alert("当前选择的【基准平均风时长+阵风时长】组合无对应查表系数，无法完成阵风换算，请更换时距搭配");
                return;
            }

            // 高度换算10m风速
            const U10 = Uz * Math.log(10/z0) / Math.log(Z/z0);
            // 动压计算
            const pressure = 0.613 * U10 * U10 / 100;
            // 合法系数取值
            const G = terrainData[To][tau];
            const gustWind = U10 * G;

            // 填充结果并展示
            document.getElementById('u10').textContent = U10.toFixed(2);
            document.getElementById('dirOut').textContent = windDir||"无";
            document.getElementById('pressure').textContent = pressure.toFixed(3);
            document.getElementById('gustFactor').textContent = G.toFixed(2);
            document.getElementById('gustWind').textContent = gustWind.toFixed(2);
            document.getElementById('resultBox').style.display = "block";
        }
    </script>
</body>
</html>
