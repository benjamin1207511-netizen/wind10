<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10m高度风速+台风阵风双向换算工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f0f4f8;
            padding: 40px 20px;
        }
        .container {
            max-width: 620px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0, 80, 160, 0.12);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 22px;
            margin-bottom: 28px;
        }
        .block-title{
            font-size:16px;
            font-weight:bold;
            color:#224;
            margin:20px 0 10px;
            border-left:4px solid #3182ce;
            padding-left:8px;
        }
        .form-item {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 15px;
            color: #2d3748;
            margin-bottom: 6px;
            font-weight: 500;
        }
        sub {
            font-size: 0.75em;
            vertical-align: sub;
        }
        input,select {
            width: 100%;
            height: 46px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 16px;
        }
        input:focus,select:focus {
            outline: none;
            border-color: #3182ce;
        }
        .radio-group{
            display:flex;
            gap:20px;
            height:46px;
            align-items:center;
        }
        .radio-item{
            display:flex;
            align-items:center;
            gap:6px;
        }
        .radio-item input{
            width:auto;
            height:auto;
        }
        .calc-btn {
            width: 100%;
            height: 48px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        .calc-btn:hover {
            background-color: #2b6cb0;
        }
        .result-box {
            margin-top: 26px;
            padding: 20px;
            background-color: #ebf8ff;
            border-radius: 10px;
            border-left: 5px solid #3182ce;
            display:none;
        }
        .result-item {
            margin:10px 0;
            font-size:15px;
        }
        .tip {
            margin-top: 20px;
            font-size: 13px;
            color: #718096;
            line-height:1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>10m高度风速+台风阵风双向换算工具</h1>

        <div class="block-title">一、换算模式选择</div>
        <div class="form-item radio-group">
            <div class="radio-item">
                <input type="radio" name="calcMode" id="modeForward" value="forward" checked>
                <label for="modeForward">正向换算（平均风→阵风）</label>
            </div>
            <div class="radio-item">
                <input type="radio" name="calcMode" id="modeReverse" value="reverse">
                <label for="modeReverse">反向换算（阵风→平均风）</label>
            </div>
        </div>

        <div class="block-title">二、高度订正输入</div>
        <div class="form-item">
            <label>测风仪器离地高度 Z（m）</label>
            <input type="number" id="Z" step="0.01" placeholder="例如：4.7">
        </div>
        <div class="form-item">
            <label id="windInputLabel">Z高度实测平均风速 Uz（m/s）</label>
            <input type="number" id="Uz" step="0.1" placeholder="例如：36.7">
        </div>
        <div class="form-item">
            <label>观测风向（0~360°，正北0°顺时针）</label>
            <input type="number" id="windDir" step="1" placeholder="例如：180">
        </div>

        <div class="block-title">三、热带气旋阵风参数配置</div>
        <div class="form-item">
            <label>下垫面地形类别</label>
            <select id="terrain">
                <option value="inland">In-Land 内陆开阔地形</option>
                <option value="offland">Off-Land 海岸离岸风</option>
                <option value="offsea">Off-Sea 海岸向岸风</option>
                <option value="atsea">At-Sea 离岸20km以上远海</option>
            </select>
        </div>
        <div class="form-item">
            <label id="baseLabel">基准平均风时长（T<sub>0</sub>）</label>
            <select id="To">
                <option value="3600">3600s（1小时平均）</option>
                <option value="600">600s（10分钟平均）</option>
                <option value="180">180s（3分钟平均）</option>
                <option value="120">120s（2分钟平均）</option>
                <option value="60">60s（1分钟平均）</option>
                <option value="3">3s（瞬时阵风）</option>
            </select>
        </div>
        <div class="form-item">
            <label id="targetLabel">目标阵风持续时长（τ）</label>
            <select id="tau">
                <option value="3">3s（瞬时阵风）</option>
                <option value="60">60s</option>
                <option value="120">120s（2分钟平均）</option>
                <option value="180">180s</option>
                <option value="600">600s</option>
                <option value="3600">3600s（1小时平均）</option>
            </select>
        </div>

        <button class="calc-btn" onclick="calcAll()">全部计算</button>

        <div class="result-box" id="resultBox">
            <div class="result-item"><strong>10米基准风速：</strong><span id="u10"></span> m/s</div>
            <div class="result-item"><strong>观测风向：</strong><span id="dirOut"></span> °</div>
            <div class="result-item"><strong>10m高度风动压：</strong><span id="pressure"></span> hPa</div>
            <div class="result-item"><strong>查表阵风系数G<sub>τ,T<sub>0</sub></sub>：</strong><span id="gustFactor"></span></div>
            <div class="result-item"><strong id="finalLabel">目标阵风风速：</strong><span id="finalWind"></span> m/s</div>
        </div>

        <div class="tip">
            技术说明：
            <br>1.高度订正采用中性层结对数风廓线，地表粗糙度z0=0.0015m，适用于开阔平原/近海中性大气；
            <br>2.阵风系数严格采用热带气旋专用换算表G(τ,T<sub>0</sub>)：正向=基准平均风×系数=阵风；反向=阵风÷系数=基准平均风；
            <br>3.风动压计算公式：0.613×风速²÷100；
            <br>4.若时距组合无原始表格系数，工具将直接终止计算并提示，不输出结果。
        </div>
    </div>

    <script>
        // 完整表格系数（含3s瞬时阵风）
        const gustTable = {
            inland:{
                3600:{3:1.75,60:1.28,120:1.19,180:1.15,600:1.08},
                600:{3:1.66,60:1.21,120:1.12,180:1.09,600:1.00},
                180:{3:1.58,60:1.15,120:1.07,180:1.00},
                120:{3:1.55,60:1.13,120:1.00},
                60:{3:1.49,60:1.00}
            },
            offland:{
                3600:{3:1.60,60:1.22,120:1.15,180:1.12,600:1.06},
                600:{3:1.52,60:1.16,120:1.09,180:1.06,600:1.00},
                180:{3:1.44,60:1.10,120:1.04,180:1.00},
                120:{3:1.42,60:1.08,120:1.00},
                60:{3:1.36,60:1.00}
            },
            offsea:{
                3600:{3:1.45,60:1.17,120:1.11,180:1.09,600:1.05},
                600:{3:1.38,60:1.11,120:1.05,180:1.03,600:1.00},
                180:{3:1.31,60:1.05,120:1.00,180:1.00},
                120:{3:1.28,60:1.03,120:1.00},
                60:{3:1.23,60:1.00}
            },
            atsea:{
                3600:{3:1.30,60:1.11,120:1.07,180:1.06,600:1.03},
                600:{3:1.23,60:1.05,120:1.02,180:1.00,600:1.00},
                180:{3:1.17,60:1.00,120:1.00,180:1.00},
                120:{3:1.15,60:1.00,120:1.00},
                60:{3:1.11,60:1.00}
            }
        };
        const z0 = 0.0015;

        // 切换模式文字提示
        const modeRadios = document.querySelectorAll('input[name="calcMode"]');
        const windInputLabel = document.getElementById('windInputLabel');
        const baseLabel = document.getElementById('baseLabel');
        const targetLabel = document.getElementById('targetLabel');
        const finalLabel = document.getElementById('finalLabel');
        modeRadios.forEach(radio=>{
            radio.addEventListener('change',()=>{
                if(radio.value==='forward'){
                    windInputLabel.textContent = 'Z高度实测平均风速 Uz（m/s）';
                    baseLabel.innerHTML = '基准平均风时长（T<sub>0</sub>）';
                    targetLabel.textContent = '目标阵风持续时长（τ）';
                    finalLabel.textContent = '目标阵风风速：';
                }else{
                    windInputLabel.textContent = 'Z高度实测阵风风速 Uz（m/s）';
                    baseLabel.innerHTML = '阵风原始时长（τ）';
                    targetLabel.textContent = '待求平均风时长（T<sub>0</sub>）';
                    finalLabel.textContent = '目标平均风速：';
                }
            })
        })

        function calcAll(){
            document.getElementById('resultBox').style.display = "none";
            const calcMode = document.querySelector('input[name="calcMode"]:checked').value;
            const Z = parseFloat(document.getElementById('Z').value);
            const Uz = parseFloat(document.getElementById('Uz').value);
            const windDir = document.getElementById('windDir').value;
            const terrain = document.getElementById('terrain').value;
            let T0, tau;
            if(calcMode === 'forward'){
                T0 = parseInt(document.getElementById('To').value);
                tau = parseInt(document.getElementById('tau').value);
            }else{
                //反向模式互换两个时长，To选择框是τ阵风时长，tau选择框是T0基准时长
                tau = parseInt(document.getElementById('To').value);
                T0 = parseInt(document.getElementById('tau').value);
            }

            if(isNaN(Z)||isNaN(Uz)||Z<=0||Uz<=0){
                alert("请填写有效的观测高度与风速数值");
                return;
            }

            const terrainData = gustTable[terrain];
            if (!terrainData || !terrainData[T0] || terrainData[T0][tau] === undefined) {
                alert("当前时长组合无对应查表系数，无法换算，请更换时长搭配");
                return;
            }
            const G = terrainData[T0][tau];
            // 高度订正到10m高度风速
            const U10_raw = Uz * Math.log(10/z0) / Math.log(Z/z0);
            let U10_base, finalWind;
            if(calcMode==='forward'){
                U10_base = U10_raw;
                finalWind = U10_base * G;
            }else{
                U10_base = U10_raw;
                finalWind = U10_base / G;
            }
            const pressure = 0.613 * U10_base * U10_base / 100;

            document.getElementById('u10').textContent = U10_base.toFixed(2);
            document.getElementById('dirOut').textContent = windDir||"无";
            document.getElementById('pressure').textContent = pressure.toFixed(3);
            document.getElementById('gustFactor').textContent = G.toFixed(2);
            document.getElementById('finalWind').textContent = finalWind.toFixed(2);
            document.getElementById('resultBox').style.display = "block";
        }
    </script>
</body>
</html>
