<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10m高度风速换算工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f0f4f8;
            padding: 40px 20px;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: #fff;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0, 80, 160, 0.12);
        }
        h1 {
            text-align: center;
            color: #1a365d;
            font-size: 22px;
            margin-bottom: 28px;
        }
        .form-item {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 15px;
            color: #2d3748;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            height: 46px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 16px;
            transition: border 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #3182ce;
        }
        .calc-btn {
            width: 100%;
            height: 48px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .calc-btn:hover {
            background-color: #2b6cb0;
        }
        .result-box {
            margin-top: 26px;
            padding: 20px;
            background-color: #ebf8ff;
            border-radius: 10px;
            border-left: 5px solid #3182ce;
        }
        .result-item {
            margin:10px 0;
        }
        .result-title {
            font-size: 15px;
            color: #2c5282;
        }
        .result-value {
            font-size: 20px;
            font-weight: bold;
            color: #2c5282;
        }
        .tip {
            margin-top: 20px;
            font-size: 13px;
            color: #718096;
            line-height:1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>10m高度风速换算工具</h1>

        <div class="form-item">
            <label>测风仪器离地高度 Z（m）</label>
            <input type="number" id="Z" step="0.01" placeholder="例如：20">
        </div>
        <div class="form-item">
            <label>Z高度实测风速 Uz（m/s）</label>
            <input type="number" id="Uz" step="0.01" placeholder="例如：6">
        </div>
        <div class="form-item">
            <label>地面风向（0~360°，正北为0°顺时针计量）</label>
            <input type="number" id="windDir" step="1" placeholder="例如：180">
        </div>

        <button class="calc-btn" onclick="calcWind()">执行订正计算</button>

        <div class="result-box" id="resultBox" style="display:none;">
            <div class="result-item">
                <div class="result-title">订正至10m高度风速 U₁₀</div>
                <div class="result-value" id="u10Val">0.00 m/s</div>
            </div>
            <div class="result-item">
                <div class="result-title">观测风向</div>
                <div class="result-value" id="dirVal">0°</div>
            </div>
            <div class="result-item">
                <div class="result-title">风动压（风压，hPa）</div>
                <div class="result-value" id="windPressVal">0.00 hPa</div>
            </div>
        </div>

        <div class="tip">
            技术说明：
            <br>1.风速订正基于中性大气边界层对数风廓线，地表粗糙度Z₀=0.0015m，适用于平坦开阔下垫面中性层结时段；
            <br>2.风向不随高度订正，直接沿用原始观测值；
            <br>3.风动压采用动能压力公式计算，空气密度ρ=1.225kg/m³，单位换算1hPa=100Pa，用于表征气流冲击荷载。
        </div>
    </div>

    <script>
        const Z0 = 0.0015;
        const ln10Z0 = Math.log(10 / Z0);
        const rho = 1.225;

        function calcWind() {
            const Z = parseFloat(document.getElementById('Z').value);
            const Uz = parseFloat(document.getElementById('Uz').value);
            const dir = parseFloat(document.getElementById('windDir').value);
            const resultBox = document.getElementById('resultBox');

            if (isNaN(Z) || isNaN(Uz) || Z <= 0 || Uz < 0) {
                alert('请输入有效的正数高度与风速！');
                resultBox.style.display = 'none';
                return;
            }
            if (!isNaN(dir) && (dir < 0 || dir > 360)) {
                alert('风向角度取值范围为0~360°');
                resultBox.style.display = 'none';
                return;
            }

            const lnZZ0 = Math.log(Z / Z0);
            const U10 = (ln10Z0 / lnZZ0) * Uz;
            const windPressurePa = 0.5 * rho * U10 * U10;
            const windPressureHpa = windPressurePa / 100;
            const showDir = isNaN(dir) ? "未录入风向数据" : dir.toFixed(1)+" °";

            document.getElementById('u10Val').textContent = U10.toFixed(2) + ' m/s';
            document.getElementById('dirVal').textContent = showDir;
            document.getElementById('windPressVal').textContent = windPressureHpa.toFixed(4) + ' hPa';

            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
